name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile

  automated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [test:unit, test:protocol, test:app-server]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.suite }}

  extension-host-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Extension Host smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Run Extension Host smoke
        if: runner.os != 'Linux'
        run: npm run test:extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-host-${{ runner.os }}
          path: artifacts/0001-extension-release-readiness/
          if-no-files-found: warn

  package-vsix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: agenthub-vsix-${{ runner.os }}
          path: releases/agenthub-codex.vsix
          if-no-files-found: error
